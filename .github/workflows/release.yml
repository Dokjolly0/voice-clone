name: Release

# Publishes a build of every commit on main whose CI passed: the wheel and sdist, plus ready-to-run archives for
# Windows and Linux (sources and launchers; the first start installs everything else).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6

      - name: Build
        id: build
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          tag="v${version}-build.${{ github.run_number }}"
          uv build --out-dir dist
          # git archive applies .gitattributes: CRLF for the Windows scripts, the executable bit for ./voice-clone.
          git archive --format=zip --prefix="voice-clone-${version}/" -o "dist/voice-clone-${version}-windows.zip" HEAD
          git archive --format=tar.gz --prefix="voice-clone-${version}/" -o "dist/voice-clone-${version}-linux.tar.gz" HEAD
          (cd dist && sha256sum * > SHA256SUMS)
          ls -l dist
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.build.outputs.tag }}" dist/* \
            --target "${{ github.event.workflow_run.head_sha }}" \
            --title "voice-clone ${{ steps.build.outputs.version }} (build ${{ github.run_number }})" \
            --generate-notes
